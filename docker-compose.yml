services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: art_manager_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - db_data:/app
      - upload_data:/app/app/uploads
    environment:
      - ENVIRONMENT=development
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: art_manager_frontend
    ports:
      - "4321:4321"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - PUBLIC_API_URL=http://backend:8000  # usa el nombre del servicio
    depends_on:
      - backend
    restart: unless-stopped

# Volúmenes con nombre para persistencia del backend
volumes:
  db_data:
  upload_data: